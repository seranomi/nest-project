db:
  type: ${DB_TYPE}
  host: ${DB_HOST}
  port: ${DB_PORT}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  database: ${DB_NAME}
auth:
  jwt:
    secret: ${JWT_SECRET}
    signOptions:
      expiresIn: ${JWT_EXPIRES_IN}
s3:
  bucket: ${S3_BUCKET}
  region: ${S3_REGION}
  accessKeyId: ${S3_ACCESS_KEY_ID}
  secretAccessKey: ${S3_SECRET_ACCESS_KEY}
openai:
  apiKey: ${OPENAI_API_KEY}